# Rebuilds data/catalog/ from the seeds plus Wikipedia and commits the result to the same branch.
#
# It runs only when you start it (Actions tab → Build catalog → Run workflow), so the catalog in the
# repository changes only when you ask for it. Run it after editing the seeds or sources.json.
#
# Wikipedia limits how fast unidentified scripts may ask, so a full build takes a while: it waits
# whenever it is told to slow down. To identify the build to Wikipedia (which they ask for, and which
# may lift the limit), set a repository variable named CATALOG_USER_AGENT, for example
#   CurioCapsuleCatalog/1.0 (https://github.com/you/your-repo; you@example.com)
name: Build catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'rebuild = fetch from Wikipedia again (about 15 minutes); refilter = only re-apply the rules and exclude list (seconds)'
        type: choice
        options: [rebuild, refilter]
        default: rebuild
      probe:
        description: 'Only try out searches and write nothing (separate several with ;;)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref }}-${{ inputs.probe && 'probe' || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CATALOG_USER_AGENT: ${{ vars.CATALOG_USER_AGENT }}
      CATALOG_TIME_BUDGET_MIN: 40
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Try out searches
        if: ${{ inputs.probe }}
        env:
          PROBE: ${{ inputs.probe }}
        run: node scripts/catalog/build.mjs --probe "$PROBE"
      - name: Build catalog from seeds and Wikipedia
        if: ${{ !inputs.probe }}
        run: node scripts/catalog/build.mjs ${{ inputs.mode == 'refilter' && '--refilter' || '' }}
      - name: Validate catalog
        if: ${{ !inputs.probe }}
        run: node scripts/catalog/validate.mjs --min 1000
      - name: Unit tests
        if: ${{ !inputs.probe }}
        run: npm test
      - name: Commit refreshed catalog
        id: commit
        if: ${{ !inputs.probe }}
        run: |
          git add -A data
          if git diff --cached --quiet -- data/catalog ':(exclude)data/catalog/index.json'; then
            echo "Catalog items unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild catalog from Wikipedia"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Commits pushed by a workflow do not trigger other workflows, so publish from here on main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
