# Rebuilds data/catalog/ from the seeds plus Wikipedia and commits the result to the same branch.
name: Build catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/catalog/**'
      - 'data/seeds/**'
      - 'src/core/vocab.js'
      - '.github/workflows/build-catalog.yml'

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build catalog from seeds and Wikipedia
        run: node scripts/catalog/build.mjs
      - name: Validate catalog
        run: node scripts/catalog/validate.mjs --min 1000
      - name: Unit tests
        run: npm test
      - name: Commit refreshed catalog
        id: commit
        run: |
          git add data/catalog
          if git diff --cached --quiet -- . ':(exclude)data/catalog/index.json'; then
            echo "Catalog items unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild catalog from Wikipedia"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Commits pushed by a workflow do not trigger other workflows, so publish from here on main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
